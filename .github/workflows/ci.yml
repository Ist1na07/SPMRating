name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Interface compliance check
        run: python tests/compliance_check.py

      - name: Unit tests (pytest)
        run: python -m pytest tests/ -q

  candidate:
    name: v1.2.0 candidate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidates/v1.2.0-rc3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install candidate dependencies
        run: python -m pip install -r requirements.txt
      - name: Check candidate scoring and interfaces
        run: python -m unittest discover -s tests -v
